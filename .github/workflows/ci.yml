name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check "projects/**/*.{ts,html,json,md}"

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build ngx-error-summary

      - name: Verify the package is publishable
        working-directory: dist/ngx-error-summary
        run: npm pack --dry-run
