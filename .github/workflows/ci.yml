name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build the library
        run: npm run build

      - name: Build the demo
        run: npx ng build demo

      - name: Verify the package is publishable
        working-directory: dist/ngx-error-summary
        run: npm pack --dry-run
