name: Publish

# Triggered by hand from the Actions tab. Publishing is irreversible — an npm
# version can never be replaced — so this defaults to a dry run and you have to
# deliberately untick it to release for real.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (untick to actually publish)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for npm trusted publishing (OIDC) and provenance. No NPM_TOKEN
      # is stored anywhere; npm verifies this workflow's identity directly.
      id-token: write
      # Needed to push the version tag and create the GitHub release. Only used
      # after a successful real publish.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell an already-tagged version from a new one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; the runner ships older.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build the library
        run: npm run build

      - name: Read the version being published
        id: meta
        run: |
          VERSION=$(node -p "require('./dist/ngx-error-summary/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version to publish: $VERSION"

      # Fail early with a clear message rather than a raw 403 from the registry.
      # Only gates a real publish: a dry run should stay usable at any time for
      # checking the pipeline, including when the current version is already out.
      - name: Refuse to republish an existing version
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "ngx-error-summary@$VERSION" version >/dev/null 2>&1; then
            echo "::error::ngx-error-summary@$VERSION is already on npm. Bump the version in projects/ngx-error-summary/package.json."
            exit 1
          fi
          echo "$VERSION is unpublished — good to go."

      - name: Note whether this version is already published
        if: ${{ inputs.dry_run }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "ngx-error-summary@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$VERSION is already on npm. The dry run still exercises the pipeline, but a real publish would be rejected until the version is bumped."
          else
            echo "$VERSION is unpublished — a real run would publish it."
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish ./dist/ngx-error-summary --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish ./dist/ngx-error-summary --access public

      # Only after the publish has actually succeeded: a tag pointing at a
      # version that never made it to npm is worse than no tag.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$VERSION"
          git push origin "$TAG"
          echo "Tagged $TAG"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
            exit 0
          fi
          # Lift this version's section out of the changelog for the notes.
          awk -v v="^## \\[$VERSION\\]" '$0 ~ v {flag=1; next} /^## \[/{flag=0} flag' \
            CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for $VERSION; falling back to a bare note."
            echo "See CHANGELOG.md." > /tmp/notes.md
          fi
          echo "" >> /tmp/notes.md
          echo "https://www.npmjs.com/package/ngx-error-summary/v/$VERSION" >> /tmp/notes.md
          gh release create "$TAG" --title "$VERSION" --notes-file /tmp/notes.md
          echo "Created release $TAG"

      - name: Summary
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run only — nothing was published" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with **Dry run** unticked to publish \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published ngx-error-summary@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/ngx-error-summary/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
